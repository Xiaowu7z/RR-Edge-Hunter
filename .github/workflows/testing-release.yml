name: Desktop Testing Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: desktop-testing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  testing:
    if: github.repository == 'Xiaowu7z/RR-Edge-Hunter' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout testing source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Validate source revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run Python regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile rr_optimizer.py cfopt/*.py tools/build_release.py tools/build_portable_release.py

      - name: Check browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js

      - name: Build source verification package
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_release.py --version 1.0.0

      - name: Install pinned Windows packager
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "pyinstaller==6.11.1"

      - name: Build Windows testing package
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_portable_release.py --version 1.0.0 --target Windows-x64

      - name: Verify and rename fixed testing assets
        shell: bash
        env:
          TESTING_VERSION: "1.0.0"
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          source = Path("dist/CF-IP-Optimizer-Windows-x64.zip")
          manifest_path = Path("dist/CF-IP-Optimizer-Windows-x64.manifest.json")
          destination = Path("dist/CF-IP-Optimizer-Windows-x64-testing.zip")
          checksum_path = Path(f"{destination}.sha256")
          if not source.is_file() or not manifest_path.is_file():
              raise SystemExit("Windows 便携包或 manifest 缺失")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("version") != os.environ["TESTING_VERSION"]:
              raise SystemExit("测试包内部版本不是固定的 1.0.0")
          if manifest.get("source_revision") != os.environ["GITHUB_SHA"]:
              raise SystemExit("测试包提交与工作流提交不一致")
          with ZipFile(source) as package:
              names = set(package.namelist())
          if "CF-IP-Optimizer/CF-IP-Optimizer.exe" not in names:
              raise SystemExit("Windows 便携包缺少程序入口")
          if not any(name.startswith("CF-IP-Optimizer/_internal/") for name in names):
              raise SystemExit("Windows 便携包缺少 PyInstaller 运行时")
          source.replace(destination)
          digest = hashlib.sha256(destination.read_bytes()).hexdigest()
          checksum_path.write_text(f"{digest}  {destination.name}\n", encoding="ascii")
          PY

      - name: Update isolated testing prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: "1.0.0"
        run: |
          set -euo pipefail
          TESTING_TAG="testing"
          test "$TESTING_TAG" = "testing"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          NOTES_FILE="${RUNNER_TEMP}/testing-release-notes.md"
          printf '%s\n\n%s\n\n%s\n' \
            "Windows 测试通道（应用版本仍为 $VERSION）" \
            "构建提交：\`$GITHUB_SHA\`" \
            "这是预发布测试包；同版本更新需要手动下载、解压并覆盖旧目录。正式 latest 版本不受影响。" \
            > "$NOTES_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TESTING_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TESTING_TAG:refs/tags/$TESTING_TAG"

          if gh release view "$TESTING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TESTING_TAG" \
              dist/CF-IP-Optimizer-Windows-x64-testing.zip \
              dist/CF-IP-Optimizer-Windows-x64-testing.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TESTING_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "CF 优选IP Windows 测试通道" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --latest=false
          else
            gh release create "$TESTING_TAG" \
              dist/CF-IP-Optimizer-Windows-x64-testing.zip \
              dist/CF-IP-Optimizer-Windows-x64-testing.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "CF 优选IP Windows 测试通道" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          fi
