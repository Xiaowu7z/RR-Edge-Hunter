name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24.13"
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify and compile the pinned reference source
        shell: bash
        run: |
          set -euo pipefail
          echo "83663f1e2655943ebae2d99d520a35f8c5dd58142ac58cf2169220e35deb11ab  third_party/better-cloudflare-ip/main.go" |
            sha256sum --check --strict
          go build -trimpath -o "${RUNNER_TEMP}/better-cloudflare-ip" ./third_party/better-cloudflare-ip/main.go
      - name: Compile Python sources
        run: python -m py_compile rr_optimizer.py cfopt/*.py
      - name: Check browser JavaScript
        run: node --check web/app.js
      - name: Build release package
        run: python tools/build_release.py --version ci
