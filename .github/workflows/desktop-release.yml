name: Desktop Stable Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-stable-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Xiaowu7z/RR-Edge-Hunter' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout latest source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Test latest source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest discover -s tests -v
          python -m py_compile rr_optimizer.py cfopt/*.py tools/build_release.py tools/build_portable_release.py
          node --check web/app.js

      - name: Fetch pinned official Xray core
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/Xray-windows-64-v26.7.28.zip"
          curl --fail --location --retry 3 \
            https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-windows-64.zip \
            --output "$ARCHIVE"
          echo "c7172078fca4711bcd92a4774dcd1822544579c58816197575c47533317fd8d1  $ARCHIVE" | sha256sum --check --strict
          mkdir -p runtime
          unzip -p "$ARCHIVE" xray.exe > runtime/xray.exe
          unzip -p "$ARCHIVE" LICENSE > runtime/Xray-core-LICENSE.txt
          test -s runtime/xray.exe
          test -s runtime/Xray-core-LICENSE.txt

      - name: Build self-contained Windows application
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "pyinstaller==6.11.1"
          python tools/build_portable_release.py \
            --version 1.0.0 \
            --target Windows-x64 \
            --xray-exe runtime/xray.exe \
            --xray-license runtime/Xray-core-LICENSE.txt

      - name: Smoke-test portable Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $PWD 'dist\CF-IP-Optimizer-Windows-x64.zip'
          if (-not (Test-Path $archive)) { throw 'Portable application bundle is missing' }

          $stage = Join-Path $env:RUNNER_TEMP 'cfip-portable-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $stage -Force
          $source = Join-Path $stage 'CF-IP-Optimizer'
          $portableExe = Join-Path $source 'CF-IP-Optimizer.exe'
          if (-not (Test-Path $portableExe)) {
            throw 'Portable application executable is missing'
          }
          $xrayExe = Join-Path $source 'xray\xray.exe'
          if (-not (Test-Path $xrayExe)) { throw 'Bundled Xray core is missing' }
          $xrayVersion = & $xrayExe version | Out-String
          if ($LASTEXITCODE -ne 0 -or $xrayVersion -notmatch 'Xray') { throw 'Bundled Xray core smoke test failed' }
          $portableHelp = Start-Process -FilePath $portableExe -ArgumentList '--help' -Wait -PassThru
          if ($portableHelp.ExitCode -ne 0) { throw "Portable application smoke test failed with exit code $($portableHelp.ExitCode)" }

          $portableSha = Join-Path $PWD 'dist\CF-IP-Optimizer-Windows-x64.sha256'
          if (-not (Test-Path $portableSha)) { throw 'Portable application checksum is missing' }
          $expectedPortableHash = ((Get-Content -LiteralPath $portableSha -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualPortableHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualPortableHash -ne $expectedPortableHash) { throw 'Portable application checksum verification failed' }

      - name: Replace old releases with the latest portable Windows package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          NOTES_FILE="${RUNNER_TEMP}/stable-release-notes.md"
          printf '%s\n\n%s\n\n%s\n' \
            "CF 优选IP Windows 正式版 1.0.0" \
            "构建提交：\`$GITHUB_SHA\`" \
            "仅提供免安装便携版，解压后运行 CF-IP-Optimizer.exe；内置官方 Xray-core，候选必须用完整 VMess/VLESS 节点通过 V2rayNG 默认 generate_204 同口径测试；同时包含真实下载测速、IPv4/IPv6、定时运行与 Cloudflare A/AAAA 灰云同步。" \
            > "$NOTES_FILE"

          while IFS= read -r OLD_TAG; do
            test -z "$OLD_TAG" || gh release delete "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/$TAG"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" "$GITHUB_SHA" -m "CF 优选IP Windows 1.0.0"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" \
            dist/CF-IP-Optimizer-Windows-x64.zip \
            dist/CF-IP-Optimizer-Windows-x64.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CF 优选IP Windows 1.0.0" \
            --notes-file "$NOTES_FILE" \
            --latest

          if git ls-remote --exit-code --tags origin refs/tags/testing >/dev/null 2>&1; then
            git push origin :refs/tags/testing
          fi
