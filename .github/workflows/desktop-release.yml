name: Desktop Stable Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-stable-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Xiaowu7z/RR-Edge-Hunter' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout latest source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Test latest source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest discover -s tests -v
          python -m py_compile rr_optimizer.py cfopt/*.py tools/build_release.py tools/build_portable_release.py
          node --check web/app.js

      - name: Build self-contained Windows application
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "pyinstaller==6.11.1"
          python tools/build_portable_release.py --version 1.0.0 --target Windows-x64

      - name: Install Inno Setup when needed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $compiler)) {
            throw 'Inno Setup compiler is unavailable'
          }

      - name: Build and smoke-test Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $PWD 'dist\CF-IP-Optimizer-Windows-x64.zip'
          if (-not (Test-Path $archive)) { throw 'Portable application bundle is missing' }

          $stage = Join-Path $env:RUNNER_TEMP 'cfip-installer-stage'
          $output = Join-Path $PWD 'release-dist'
          New-Item -ItemType Directory -Force -Path $stage, $output | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $stage -Force
          $source = Join-Path $stage 'CF-IP-Optimizer'
          if (-not (Test-Path (Join-Path $source 'CF-IP-Optimizer.exe'))) {
            throw 'Installer source executable is missing'
          }

          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $compiler "/DMyAppVersion=1.0.0" "/DMySourceDir=$source" "/DMyOutputDir=$output" '.github\installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          $setup = Join-Path $output 'CF-IP-Optimizer-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'Windows installer was not produced' }
          $smoke = Join-Path $env:RUNNER_TEMP 'cfip-installed-smoke'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$smoke") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent install failed with exit code $($install.ExitCode)" }
          $installedExe = Join-Path $smoke 'CF-IP-Optimizer.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installed application executable is missing' }
          $help = Start-Process -FilePath $installedExe -ArgumentList '--help' -Wait -PassThru
          if ($help.ExitCode -ne 0) { throw "Installed application smoke test failed with exit code $($help.ExitCode)" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          "$hash  CF-IP-Optimizer-Setup.exe" | Set-Content -Encoding ascii (Join-Path $output 'CF-IP-Optimizer-Setup.exe.sha256')

      - name: Replace old releases with the latest stable installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          NOTES_FILE="${RUNNER_TEMP}/stable-release-notes.md"
          printf '%s\n\n%s\n\n%s\n' \
            "CF 优选IP Windows 正式版 1.0.0" \
            "构建提交：\`$GITHUB_SHA\`" \
            "包含直接 IP 优选、亚洲狩猎、IPv4/IPv6、定时运行，以及冠军 IP 同步到 Cloudflare A/AAAA 灰云记录。" \
            > "$NOTES_FILE"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/$TAG"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" "$GITHUB_SHA" -m "CF 优选IP Windows 1.0.0"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" \
            release-dist/CF-IP-Optimizer-Setup.exe \
            release-dist/CF-IP-Optimizer-Setup.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CF 优选IP Windows 1.0.0" \
            --notes-file "$NOTES_FILE" \
            --latest

          if gh release view testing --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete testing --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          elif git ls-remote --exit-code --tags origin refs/tags/testing >/dev/null 2>&1; then
            git push origin :refs/tags/testing
          fi
