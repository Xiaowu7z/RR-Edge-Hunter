name: Desktop Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Xiaowu7z/RR-Edge-Hunter'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        shell: bash
        run: python -m py_compile rr_optimizer.py cfopt/*.py tools/build_portable_release.py
      - run: node --check web/app.js
      - name: Build source package
        run: python tools/build_release.py --version "${{ github.ref_name }}"
      - name: Install Windows packager
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pyinstaller==6.11.1"
      - name: Build Windows portable package
        run: python tools/build_portable_release.py --version "${{ github.ref_name }}" --target Windows-x64
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: dist/*
